name: Check Cloudflare Worker

on:
  pull_request:
    paths:
      - ".github/workflows/check-cloudflare-worker.yml"
      - "cloudflare/ejscreen-proxy/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/check-cloudflare-worker.yml"
      - "cloudflare/ejscreen-proxy/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/ejscreen-proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run unit tests
        run: pnpm test
      - name: Check Worker syntax
        run: pnpm run check
      - name: Validate Wrangler configuration
        run: pnpm run deploy:dry-run
